_extends: .github
# Our versions and tags are MAJOR.MINOR.PATCH with no prefix (e.g. 1.1.0), matching what
# maven-release-plugin tags. The jenkinsci org config uses $MAJOR.$MINOR, so override it here.
version-template: $MAJOR.$MINOR.$PATCH
name-template: $NEXT_MINOR_VERSION
tag-template: $NEXT_MINOR_VERSION
template: |
  ## Changes

  $CHANGES
